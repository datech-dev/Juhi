name: Juhi VPS Continuous Deployment

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
      - master

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/juhi-api
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: services/api
          file: services/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-vps:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "Navigating to /opt/juhi..."
            cd /opt/juhi
            echo "Pulling latest git changes..."
            git pull origin master || true
            echo "Building or pulling Docker images..."
            docker compose -f docker-compose.prod.yml --env-file .env.production build
            echo "Restarting services with zero downtime..."
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --remove-orphans
            echo "Waiting for PostgreSQL and API readiness..."
            sleep 8
            echo "Applying latest database migrations..."
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T api alembic upgrade head
            echo "Verifying health endpoint..."
            curl -f http://127.0.0.1:8090/api/v1/health || curl -f http://localhost:8090/api/v1/health
            echo "Juhi deployment successfully completed on VPS!"
