services:
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    image: ${API_IMAGE:-ghcr.io/datech-dev/juhi/juhi-api:latest}
    container_name: juhi-api-prod
    restart: unless-stopped
    ports:
      - "${API_PORT:-8090}:8000"
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    image: ${WORKER_IMAGE:-ghcr.io/datech-dev/juhi/juhi-worker:latest}
    container_name: juhi-worker-prod
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    container_name: juhi-postgres-prod
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-juhi_prod} -d ${POSTGRES_DB:-juhi_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_prod_data:
